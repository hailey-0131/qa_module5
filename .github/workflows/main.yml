# Name of the GitHub Actions workflow
name: main

# Controls when the workflow will run
on:

  # Run when code is pushed to the main branch
  push:
    branches: ["main"]

  # Run when a pull request is made into the main branch
  pull_request:
    branches: ["main"]

  # Also allow the workflow to be started manually
  workflow_dispatch:


# Jobs that will run as part of the workflow
jobs:

  # Job for testing the Python code
  test:

    # Use a GitHub-hosted Ubuntu machine
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repository
      # This makes your Python files available to the workflow
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      # Choose the Python version that your project uses
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install the Python modules required by the project
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 4. Run all pytest tests in the repository
      - name: Run pytest tests
        run: |
          python -m pytest -v

      # 6. Check that the GitHub secret is available
      - name: Check Secret
        env:
          # Load the GitHub secret into an environment variable
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          # Check whether the secret contains a value
          if [ -n "$DEMO_SECRET" ]; then
            echo "The secret was loaded successfully"
          else
            echo "Cannot find our secret"
          fi

  # ==================================================
  # BUILD JOB
  # Only runs if the test job succeeds
  # ==================================================

  build:
    name: Building Docker Image
    needs: test
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: library-clean

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4


      # Build Docker image
      - name: Create Image
        run: |
          docker build \
            --file docker\Dockerfile \
            --tag $IMAGE_NAME:${{ github.sha }} \
            .


      # Run Docker image
      - name: Run Docker Image
        run: |
          docker run --rm \
            $IMAGE_NAME:${{ github.sha }}


      # Save Docker image as a .tar file
      - name: Save Docker Image
        run: |
          docker save \
            $IMAGE_NAME:${{ github.sha }} \
            --output $IMAGE_NAME.tar


      # Upload Docker image as a GitHub Actions artifact
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
          path: ${{ env.IMAGE_NAME }}.tar
          if-no-files-found: error

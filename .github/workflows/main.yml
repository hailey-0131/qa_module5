# This is a basic workflow to help you get started with GitHub Actions

# Name of the workflow
name: Eds Job

# Controls when the workflow will run
on:
  # Triggers the workflow when code is pushed to the "main" branch
  push:
    branches: ["main"]

  # Triggers the workflow when a pull request targets the "main" branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow is made up of one or more jobs
# Jobs can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:

    # Specifies the type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps are the sequence of tasks executed as part of the job
    steps:

      # Checks out the repository into $GITHUB_WORKSPACE
      # This allows the workflow to access your repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs a single command using the runner's shell
      - name: Run a one-line script
        run: echo "Hello, world!"
